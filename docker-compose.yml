services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: cbse_postgres
    environment:
      POSTGRES_DB: cbse_learning
      POSTGRES_USER: cbse_user
      POSTGRES_PASSWORD: cbse_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: